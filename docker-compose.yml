# Local SQL Server 2022 (Developer edition, free for dev/test use).
# On Apple Silicon, enable "Use Rosetta for x86_64/amd64 emulation" in Docker Desktop settings.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sacco-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - ./sql:/sql:ro
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
